<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Financeiro • Barbearia Suprema</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="bg"></div>

  <header class="top">
    <div class="brand">
      <img class="logo" src="/assets/logo.jpeg" alt="Barbearia Suprema" />
      <div>
        <div class="brand-title">Financeiro • Barbearia Suprema</div>
        <div class="brand-sub">Entradas, saídas e saldo</div>
      </div>
    </div>

    <div class="admin-actions">
      <a class="ghost small" href="/admin/login">Admin</a>
      <a class="ghost small" href="/">Voltar</a>
      <a class="ghost small" href="/finance/logout">Sair</a>
    </div>
  </header>

  <main class="wrap single finance-wrap">
    <section class="card" id="finCard">
      <div class="row">
        <h2>Resumo financeiro</h2>
        <button class="ghost small" id="btnFinRefresh" type="button">Atualizar</button>
      </div>

      <div class="grid2">
        <div class="field">
          <label>Período</label>
          <select id="finRange">
            <option value="day">Dia</option>
            <option value="week">Semana</option>
            <option value="month">Mês</option>
          </select>
        </div>

        <div class="field" id="finDateWrap">
          <label>Data</label>
          <input id="finDate" type="date" />
        </div>

        <div class="field hidden" id="finMonthWrap">
          <label>Mês</label>
          <input id="finMonth" type="month" />
        </div>
      </div>

      <p class="hint" id="periodLabel"></p>

      <div class="statgrid finance-kpis">
        <div class="stat">
          <div class="stat-big" id="kpiIn">R$ 0,00</div>
          <div class="stat-sub">Entrou</div>
        </div>
        <div class="stat">
          <div class="stat-big" id="kpiOut">R$ 0,00</div>
          <div class="stat-sub">Saiu</div>
        </div>
        <div class="stat">
          <div class="stat-big" id="kpiNet">R$ 0,00</div>
          <div class="stat-sub">Saldo</div>
        </div>
      </div>

      <hr class="sep" />

      <h3>Lançar movimento</h3>
      <div class="grid2">
        <div class="field">
          <label>Tipo</label>
          <select id="txType">
            <option value="in">Entrada</option>
            <option value="out">Saída</option>
          </select>
        </div>

        <div class="field">
          <label>Valor (R$)</label>
          <input id="txAmount" type="number" step="0.01" min="0" placeholder="0.00" />
        </div>

        <div class="field">
          <label>Método</label>
          <select id="txMethod">
            <option value="">(opcional)</option>
            <option value="dinheiro">Dinheiro</option>
            <option value="pix">Pix</option>
            <option value="cartao">Cartão</option>
            <option value="transferencia">Transferência</option>
          </select>
        </div>

        <div class="field">
          <label>Categoria</label>
          <input id="txCategory" placeholder="Ex: Corte, produto, aluguel..." />
        </div>

        <div class="field full">
          <label>Descrição</label>
          <input id="txDesc" placeholder="Ex: Corte João / compra de produto" />
        </div>
      </div>

      <button class="primary small" id="btnTxAdd" type="button">Salvar movimento</button>
      <p class="hint" id="txMsg"></p>

      <hr class="sep" />

      <h3>Movimentos</h3>
      <div class="table" id="txTable"></div>
    </section>
  </main>

  <script src="/finance.js"></script>
</body>
</html>
